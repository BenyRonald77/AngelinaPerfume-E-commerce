name: Deploy ke VPS

# Setiap push ke main: jalankan tes, lalu (bila lulus) jalankan update.sh di VPS testing.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Deploy tidak boleh berjalan bersamaan; push berikutnya menunggu yang sebelumnya selesai
concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  test:
    name: Tes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, intl, zip, bcmath, pdo_sqlite
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Dependensi PHP
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Build aset (dibutuhkan halaman yang diuji)
        run: npm ci && npm run build

      - name: Siapkan .env tes
        run: cp .env.example .env && php artisan key:generate

      - name: php artisan test
        run: php artisan test

  deploy:
    name: Deploy ke VPS
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Siapkan SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      # Kunci ini di VPS dibatasi hanya bisa menjalankan ~/angelia-perfume/update.sh
      - name: Jalankan update.sh di VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes "$VPS_USER@$VPS_HOST"

      # Dicoba ulang beberapa kali: container butuh beberapa detik setelah dinyalakan ulang
      - name: Cek situs
        run: curl --fail --silent --show-error --output /dev/null --max-time 30 --retry 10 --retry-delay 3 --retry-all-errors https://angeliaperfume.duckdns.org/

  # Hosting klien (DomaiNesia Nimbus Go, cPanel). Server tidak punya Node, jadi vendor dan aset dibangun di sini
  # lalu dikirim dengan rsync. .env dan storage (foto produk, log, sesi) di server tidak pernah ditimpa.
  deploy-hosting:
    name: Deploy ke hosting DomaiNesia
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-hosting
      cancel-in-progress: false
    env:
      HOSTING_HOST: ${{ secrets.HOSTING_HOST }}
      HOSTING_USER: ${{ secrets.HOSTING_USER }}
      HOSTING_PORT: ${{ secrets.HOSTING_PORT }}
    steps:
      - name: Cek kunci hosting
        id: siap
        env:
          SSH_KEY: ${{ secrets.HOSTING_SSH_KEY }}
        run: |
          if [ -z "$SSH_KEY" ] || [ -z "$HOSTING_HOST" ]; then
            echo "Secret HOSTING_* belum diisi; deploy ke hosting dilewati."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.siap.outputs.ok == 'true'

      - uses: shivammathur/setup-php@v2
        if: steps.siap.outputs.ok == 'true'
        with:
          php-version: '8.3'
          extensions: gd, intl, zip, bcmath
          coverage: none

      - uses: actions/setup-node@v4
        if: steps.siap.outputs.ok == 'true'
        with:
          node-version: 20
          cache: npm

      - name: Build vendor (tanpa paket dev) dan aset
        if: steps.siap.outputs.ok == 'true'
        run: |
          composer install --no-dev --optimize-autoloader --no-interaction --no-progress --prefer-dist
          npm ci && npm run build

      - name: Siapkan SSH
        if: steps.siap.outputs.ok == 'true'
        env:
          SSH_KEY: ${{ secrets.HOSTING_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.HOSTING_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hosting_key
          chmod 600 ~/.ssh/hosting_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Kirim berkas (rsync)
        if: steps.siap.outputs.ok == 'true'
        run: |
          rsync -az --delete \
            --exclude='.git/' --exclude='.github/' --exclude='node_modules/' --exclude='tests/' \
            --exclude='.env' --exclude='storage/' --exclude='public/storage' --exclude='bootstrap/cache/*.php' \
            -e "ssh -i $HOME/.ssh/hosting_key -o IdentitiesOnly=yes -o BatchMode=yes -p $HOSTING_PORT" \
            ./ "$HOSTING_USER@$HOSTING_HOST:angelia-perfume/"

      - name: Migrasi dan cache di server
        if: steps.siap.outputs.ok == 'true'
        run: |
          ssh -i ~/.ssh/hosting_key -o IdentitiesOnly=yes -o BatchMode=yes -p "$HOSTING_PORT" "$HOSTING_USER@$HOSTING_HOST" '
            set -e
            cd ~/angelia-perfume
            mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs bootstrap/cache
            [ -L public/storage ] || php artisan storage:link
            php artisan migrate --force
            php artisan optimize
            php artisan filament:optimize
          '

      - name: Cek situs
        if: steps.siap.outputs.ok == 'true'
        run: curl --fail --silent --show-error --output /dev/null --max-time 30 --retry 5 --retry-delay 3 --retry-all-errors https://angeliaperfume.com/
